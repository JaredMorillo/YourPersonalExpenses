<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión</title>
    <link rel="icon" type="image/svg+xml" href="../images/favicon.svg?v=2" />
    <link rel="shortcut icon" type="image/svg+xml" href="../images/favicon.svg?v=2" />
    <link rel="stylesheet" href="../styles/account.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <h1>Iniciar sesión</h1>

        <form id="loginForm">
          <label>
            Usuario o correo electrónico
            <input id="username" type="text" placeholder="maria o correo@ejemplo.com" required />
          </label>

          <label>
            Contraseña
            <div class="password-field">
              <input id="password" type="password" placeholder="Contraseña" required />
              <button type="button" class="toggle-password" aria-label="Mostrar contraseña">Mostrar</button>
            </div>
          </label>

          <button type="submit">Entrar</button>
        </form>

        <p id="message" class="message"></p>

        <div class="link-row">
          <a href="register.html">Crear una cuenta</a>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../scripts/supabase-config.js"></script>
    <script>
      const supabaseClient = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

      supabaseClient.auth.getSession().then(({ data: { session } }) => {
        if (session) window.location.href = '../index.html';
      });

      const passwordInput = document.getElementById('password');
      const togglePasswordButton = document.querySelector('.toggle-password');

      togglePasswordButton.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        togglePasswordButton.textContent = isPassword ? 'Ocultar' : 'Mostrar';
        togglePasswordButton.setAttribute('aria-label', isPassword ? 'Ocultar contraseña' : 'Mostrar contraseña');
      });

      document.getElementById('loginForm').addEventListener('submit', async (event) => {
        event.preventDefault();

        const loginIdentifier = document.getElementById('username').value.trim();
        const password = passwordInput.value;
        const message = document.getElementById('message');

        let email = loginIdentifier;

        if (!loginIdentifier.includes('@')) {
          const { data, error: usernameError } = await supabaseClient.rpc('get_email_by_username', {
            login_username: loginIdentifier
          });

          if (usernameError || !data) {
            message.textContent = 'Usuario o contraseña incorrectos.';
            return;
          }

          email = data;
        }

        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

        if (error) {
          message.textContent = 'Usuario o contraseña incorrectos.';
          return;
        }

        window.location.href = '../index.html';
      });
    </script>
  </body>
</html>
