<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión</title>
    <link rel="icon" type="image/x-icon" href="../images/favicon.ico" />
    <link rel="stylesheet" href="../styles/account.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <h1>Iniciar sesión</h1>

        <form id="loginForm">
          <label>
            Usuario
            <input id="username" type="text" placeholder="Nombre de usuario" required />
          </label>

          <label>
            Contraseña
            <div class="password-field">
              <input id="password" type="password" placeholder="Contraseña" required />
              <button type="button" class="toggle-password" aria-label="Mostrar contraseña">Mostrar</button>
            </div>
          </label>

          <button type="submit">Entrar</button>
        </form>

        <p id="message" class="message"></p>

        <div class="link-row">
          <a href="register.html">Crear una cuenta</a>
        </div>
      </div>
    </div>

    <script>
      const ACCOUNTS_KEY = 'personal-expenses-accounts';
      const CURRENT_ACCOUNT_KEY = 'personal-expenses-current-account';

      if (localStorage.getItem(CURRENT_ACCOUNT_KEY)) {
        window.location.href = '../index.html';
      }

      const passwordInput = document.getElementById('password');
      const togglePasswordButton = document.querySelector('.toggle-password');

      togglePasswordButton.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        togglePasswordButton.textContent = isPassword ? 'Ocultar' : 'Mostrar';
        togglePasswordButton.setAttribute('aria-label', isPassword ? 'Ocultar contraseña' : 'Mostrar contraseña');
      });

      document.getElementById('loginForm').addEventListener('submit', (event) => {
        event.preventDefault();

        const username = document.getElementById('username').value.trim();
        const password = passwordInput.value;
        const message = document.getElementById('message');

        const accounts = JSON.parse(localStorage.getItem(ACCOUNTS_KEY)) || [];
        const account = accounts.find(
          (item) => item.username.toLowerCase() === username.toLowerCase() && item.password === password
        );

        if (!account) {
          message.textContent = 'Usuario o contraseña incorrectos.';
          return;
        }

        localStorage.setItem(CURRENT_ACCOUNT_KEY, account.username.toLowerCase());
        window.location.href = '../index.html';
      });
    </script>
  </body>
</html>
