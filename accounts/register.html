<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear cuenta</title>
    <link rel="icon" type="image/x-icon" href="../images/favicon.ico" />
    <link rel="shortcut icon" href="../images/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="../images/favicon.svg" />
    <link rel="icon" type="image/png" sizes="180x180" href="../images/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="../images/apple-touch-icon.png" />
    <link rel="mask-icon" href="../images/safari-pinned-tab.svg" color="#8b5cf6" />
    <link rel="stylesheet" href="../styles/register.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <h1>Crear cuenta</h1>

        <form id="registerForm">
          <label>
            Nombre de usuario
            <input id="username" type="text" placeholder="Ej. maria" required />
          </label>

          <label>
            Correo electrónico
            <input id="email" type="email" placeholder="correo@ejemplo.com" required />
          </label>

          <label>
            Contraseña
            <div class="password-field">
              <input id="password" type="password" placeholder="Contraseña" required />
              <button type="button" class="toggle-password" aria-label="Mostrar contraseña">Mostrar</button>
            </div>
          </label>

          <label>
            Confirmar contraseña
            <div class="password-field">
              <input id="confirmPassword" type="password" placeholder="Repite la contraseña" required />
              <button type="button" class="toggle-password confirm-toggle" aria-label="Mostrar contraseña">Mostrar</button>
            </div>
          </label>

          <button type="submit">Guardar cuenta</button>
        </form>

        <p id="message" class="message"></p>

        <div class="link-row">
          <a href="account.html">Ya tengo cuenta</a>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../scripts/supabase-config.js"></script>
    <script>
      const message = document.getElementById('message');
      const hasSupabaseConfig =
        window.SUPABASE_URL &&
        window.SUPABASE_ANON_KEY &&
        !window.SUPABASE_URL.includes('YOUR-PROJECT') &&
        !window.SUPABASE_ANON_KEY.includes('YOUR_SUPABASE_ANON_KEY');

      const supabaseClient = hasSupabaseConfig
        ? window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY)
        : null;

      if (!hasSupabaseConfig) {
        message.textContent = 'Configura la URL del proyecto y la clave anon publica en scripts/supabase-config.js.';
      }

      supabaseClient?.auth.getSession().then(({ data: { session } }) => {
        if (session) window.location.href = '../index.html';
      });

      const passwordInput = document.getElementById('password');
      const confirmPasswordInput = document.getElementById('confirmPassword');
      const toggleButtons = document.querySelectorAll('.toggle-password');

      toggleButtons.forEach((button) => {
        button.addEventListener('click', () => {
          const targetInput = button.classList.contains('confirm-toggle') ? confirmPasswordInput : passwordInput;
          const isPassword = targetInput.type === 'password';
          targetInput.type = isPassword ? 'text' : 'password';
          button.textContent = isPassword ? 'Ocultar' : 'Mostrar';
          button.setAttribute('aria-label', isPassword ? 'Ocultar contraseña' : 'Mostrar contraseña');
        });
      });

      document.getElementById('registerForm').addEventListener('submit', async (event) => {
        event.preventDefault();

        const username = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = passwordInput.value;
        const confirmPassword = confirmPasswordInput.value;
        if (!username || !email || !password) {
          message.textContent = 'Completa todos los campos.';
          return;
        }

        if (password !== confirmPassword) {
          message.textContent = 'Las contraseñas no coinciden.';
          return;
        }

        if (!supabaseClient) return;

        try {
          const { error } = await supabaseClient.auth.signUp({
            email,
            password,
            options: { data: { username: username.toLowerCase() } }
          });

          if (error) {
            message.textContent = error.message;
            return;
          }

          message.textContent = 'Cuenta creada. Revisa tu correo para confirmar y después inicia sesión.';
          document.getElementById('registerForm').reset();
        } catch (error) {
          message.textContent = 'No se pudo conectar con Supabase. Comprueba la URL, la clave anon y tu conexión.';
          console.error('Error al crear la cuenta:', error);
        }
      });
    </script>
  </body>
</html>
