<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear cuenta</title>
    <link rel="icon" type="image/x-icon" href="../images/favicon.ico" />
    <link rel="stylesheet" href="../styles/register.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <h1>Crear cuenta</h1>

        <form id="registerForm">
          <label>
            Nombre de usuario
            <input id="username" type="text" placeholder="Ej. maria" required />
          </label>

          <label>
            Correo electrónico
            <input id="email" type="email" placeholder="correo@ejemplo.com" required />
          </label>

          <label>
            Contraseña
            <div class="password-field">
              <input id="password" type="password" placeholder="Contraseña" required />
              <button type="button" class="toggle-password" aria-label="Mostrar contraseña">Mostrar</button>
            </div>
          </label>

          <label>
            Confirmar contraseña
            <div class="password-field">
              <input id="confirmPassword" type="password" placeholder="Repite la contraseña" required />
              <button type="button" class="toggle-password confirm-toggle" aria-label="Mostrar contraseña">Mostrar</button>
            </div>
          </label>

          <button type="submit">Guardar cuenta</button>
        </form>

        <p id="message" class="message"></p>

        <div class="link-row">
          <a href="account.html">Ya tengo cuenta</a>
        </div>
      </div>
    </div>

    <script>
      const ACCOUNTS_KEY = 'personal-expenses-accounts';
      const CURRENT_ACCOUNT_KEY = 'personal-expenses-current-account';

      if (localStorage.getItem(CURRENT_ACCOUNT_KEY)) {
        window.location.href = '../index.html';
      }

      const passwordInput = document.getElementById('password');
      const confirmPasswordInput = document.getElementById('confirmPassword');
      const toggleButtons = document.querySelectorAll('.toggle-password');

      toggleButtons.forEach((button) => {
        button.addEventListener('click', () => {
          const targetInput = button.classList.contains('confirm-toggle') ? confirmPasswordInput : passwordInput;
          const isPassword = targetInput.type === 'password';
          targetInput.type = isPassword ? 'text' : 'password';
          button.textContent = isPassword ? 'Ocultar' : 'Mostrar';
          button.setAttribute('aria-label', isPassword ? 'Ocultar contraseña' : 'Mostrar contraseña');
        });
      });

      document.getElementById('registerForm').addEventListener('submit', (event) => {
        event.preventDefault();

        const username = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = passwordInput.value;
        const confirmPassword = confirmPasswordInput.value;
        const message = document.getElementById('message');

        if (!username || !email || !password) {
          message.textContent = 'Completa todos los campos.';
          return;
        }

        if (password !== confirmPassword) {
          message.textContent = 'Las contraseñas no coinciden.';
          return;
        }

        const accounts = JSON.parse(localStorage.getItem(ACCOUNTS_KEY)) || [];
        const existingUser = accounts.some(
          (item) => item.username.toLowerCase() === username.toLowerCase()
        );

        if (existingUser) {
          message.textContent = 'Ese usuario ya existe, intenta otro.';
          return;
        }

        accounts.push({ username: username.toLowerCase(), email, password });
        localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(accounts));
        localStorage.setItem(CURRENT_ACCOUNT_KEY, username.toLowerCase());
        window.location.href = '../index.html';
      });
    </script>
  </body>
</html>
